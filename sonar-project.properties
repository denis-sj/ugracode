# SonarQube: оценка кода — часть баллов хакатона (docs/rules/code-quality.md).
sonar.projectKey=ugracode
sonar.projectName=UgraCode
sonar.sources=apps,packages,modules
sonar.tests=apps,packages,modules
sonar.test.inclusions=**/tests/**,**/*.test.ts,**/*.test.tsx
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/migrations/**,**/*.d.ts,docs/**,reports/**
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info
sonar.sourceEncoding=UTF-8
