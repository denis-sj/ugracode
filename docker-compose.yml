services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ugra
      POSTGRES_PASSWORD: ugra
      POSTGRES_DB: ugra
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ugra -d ugra"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgres://ugra:ugra@db:5432/ugra
      PORT: "3001"
      SESSION_SECRET: ${SESSION_SECRET:-demo-secret}
      AI_MODE: ${AI_MODE:-cloud}
      FEATURES_OFF: ${FEATURES_OFF:-}
      FEATURES_ON: ${FEATURES_ON:-}
      POLZA_API_KEY: ${POLZA_API_KEY:-}
      POLZA_BASE_URL: ${POLZA_BASE_URL:-https://api.polza.ai/api/v1}
      LLM_MODEL_MAIN: ${LLM_MODEL_MAIN:-deepseek/deepseek-v4.1-flash-1017}
      LLM_MODEL_CHEAP: ${LLM_MODEL_CHEAP:-deepseek/deepseek-v4.1-flash-1017}
      EMBEDDINGS_MODEL: ${EMBEDDINGS_MODEL:-}
      EMBEDDINGS_DIM: ${EMBEDDINGS_DIM:-}
      SPEECH_MODEL: ${SPEECH_MODEL:-ai-sage/gigaam-v3}
      # Озвучка ИИ-оператора (задача 039): только ключ включает голос RouterAI.
      ROUTERAI_API_KEY: ${ROUTERAI_API_KEY:-}
      ROUTERAI_BASE_URL: ${ROUTERAI_BASE_URL:-https://routerai.ru/api/v1}
      ROUTERAI_TTS_MODEL: ${ROUTERAI_TTS_MODEL:-google/gemini-3.8-flash-lite-tts}
      ROUTERAI_TTS_VOICE: ${ROUTERAI_TTS_VOICE:-Kore}
      # Постоянный HTTPS-адрес веба для QR (важнее адреса туннеля).
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-}
    volumes:
      # `pnpm demo:tunnel` пишет адрес на хосте — API читает его внутри контейнера.
      - ./.demo:/app/.demo:ro
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3001:3001"
    command: ["sh", "-c", "pnpm migrate && pnpm seed && pnpm exec tsx apps/api/src/index.ts"]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      VITE_API_URL: http://api:3001
    depends_on:
      - api
    ports:
      - "5173:5173"

  sonar:
    image: sonarqube:lts-community
    profiles: ["sonar"]
    ports:
      - "9000:9000"
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    volumes:
      - sonar-data:/opt/sonarqube/data
      - sonar-extensions:/opt/sonarqube/extensions

volumes:
  db-data:
  sonar-data:
  sonar-extensions:
