<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Исполнители</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F5F6FB}
a{color:#4B2FD0}a:hover{color:#2A1A8A}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
@keyframes grow{from{width:0}}
@keyframes wave{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
@keyframes beat{0%,100%{box-shadow:0 0 0 0 rgba(212,56,13,.45)}60%{box-shadow:0 0 0 8px rgba(212,56,13,0)}}
.glass{background:linear-gradient(180deg,rgba(255,255,255,.8),rgba(255,255,255,.58));-webkit-backdrop-filter:blur(20px) saturate(160%);backdrop-filter:blur(20px) saturate(160%);border-radius:18px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.9),0 1px 0 rgba(15,18,34,.04),0 12px 40px rgba(40,46,110,.10);position:relative}
.lg{position:relative;-webkit-backdrop-filter:blur(14px) saturate(180%);backdrop-filter:blur(14px) saturate(180%);background:radial-gradient(120% 90% at 30% 0%,rgba(255,255,255,.95),rgba(255,255,255,.4) 55%,rgba(225,230,255,.35)),linear-gradient(180deg,rgba(255,255,255,.55),rgba(214,222,255,.3));box-shadow:inset 0 1px 1px #fff,inset 0 -3px 8px rgba(110,120,210,.16),inset 0 0 0 1px rgba(255,255,255,.75),0 0 0 1px rgba(15,18,34,.05),0 10px 26px rgba(40,46,110,.14)}
.tab{position:relative;z-index:1;font-size:14px;font-weight:600;color:#5B6178;text-decoration:none;padding:0 18px;min-height:40px;display:flex;align-items:center;gap:8px;border-radius:999px}
.tab:hover{color:#0F1222}
.tab.on{color:#0F1222;background:linear-gradient(180deg,#FFFFFF,#F3F4FF);box-shadow:inset 0 1px 0 #fff,0 0 0 1px rgba(15,18,34,.05),0 4px 12px rgba(40,46,110,.14)}
.cnt{font-size:12px;font-weight:700;color:#8A90A6}
.icb{width:44px;height:44px;border-radius:50%;border:none;display:flex;align-items:center;justify-content:center;color:#2A2F45;cursor:pointer;text-decoration:none}
.ava{width:44px;height:44px;border-radius:50%;background:radial-gradient(120% 90% at 30% 0%,#9B7BFF,#5B5BFF 55%,#027DEA);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:#fff;text-decoration:none;box-shadow:inset 0 1px 1px rgba(255,255,255,.6),inset 0 -3px 8px rgba(0,0,60,.2),0 8px 20px rgba(80,70,220,.32)}
.ava:hover{color:#fff}
.k{font-size:12px;color:#8A90A6}
.h{font-size:13px;font-weight:700;color:#8A90A6;letter-spacing:.08em;text-transform:uppercase;margin:0 0 14px}
.h1{margin:0;font-size:38px;font-weight:700;letter-spacing:-.045em;background:linear-gradient(180deg,#0F1222 35%,#5A49E0);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{font-size:14px;color:#5B6178;margin-top:4px;max-width:720px;line-height:1.5}
.pri{font:inherit;font-size:14px;font-weight:700;color:#fff;background:#14172B;border:none;border-radius:10px;min-height:44px;padding:0 18px;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 1px 2px rgba(15,18,34,.25);display:inline-flex;align-items:center;justify-content:center;gap:10px;text-decoration:none}
.pri:hover{background:#262A45;color:#fff}
.sec{font:inherit;font-size:14px;font-weight:700;color:#0F1222;background:transparent;border:none;border-radius:10px;min-height:44px;padding:0 16px;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(15,18,34,.16);display:inline-flex;align-items:center;gap:8px}
.sec:hover{background:#fff}
.chip{font:inherit;font-size:13px;font-weight:600;color:#2A2F45;background:rgba(255,255,255,.6);border:none;border-radius:999px;padding:0 14px;min-height:36px;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(15,18,34,.12)}
.chip:hover{background:#fff}
.seg{font:inherit;position:relative;z-index:1;font-size:13px;font-weight:600;color:#6B7189;background:transparent;border:none;border-radius:9px;padding:0 14px;min-height:36px;cursor:pointer}
.inp{font:inherit;font-size:15px;color:#0F1222;border:none;outline:none;border-radius:10px;padding:0 14px;min-height:44px;background:rgba(255,255,255,.8);box-shadow:inset 0 0 0 1px rgba(15,18,34,.1);width:100%;box-sizing:border-box}
.inp:focus{box-shadow:inset 0 0 0 1.5px #5A49E0}
.srow{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid rgba(15,18,34,.06);font-size:14px}
.kbd{font-size:11px;font-weight:700;padding:2px 6px;border-radius:5px;background:rgba(255,255,255,.16)}
.bar{display:block;height:5px;border-radius:3px;background:rgba(15,18,34,.08);overflow:hidden}
.bar>span{display:block;height:100%;border-radius:3px;animation:grow .8s ease-out both}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

</style>
</helmet>
<div style="font-family:Manrope,system-ui,sans-serif;color:#0F1222;background:#F5F6FB;min-height:1000px;position:relative;overflow:hidden">
<div aria-hidden="true" style="position:absolute;width:820px;height:820px;left:-260px;top:-380px;border-radius:50%;background:radial-gradient(closest-side,rgba(123,77,255,.24),rgba(123,77,255,0))"></div><div aria-hidden="true" style="position:absolute;width:860px;height:860px;right:-280px;top:-340px;border-radius:50%;background:radial-gradient(closest-side,rgba(2,125,234,.2),rgba(2,125,234,0))"></div><div aria-hidden="true" style="position:absolute;width:1100px;height:700px;left:20%;bottom:-460px;border-radius:50%;background:radial-gradient(closest-side,rgba(182,217,252,.5),rgba(182,217,252,0))"></div>
<header style="position:relative;z-index:6;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:16px;padding:20px 32px"><span style="font-weight:800;font-size:16px;letter-spacing:-.02em">Диспетчерская</span><nav class="lg" aria-label="Разделы" style="display:flex;gap:2px;padding:5px;border-radius:999px"><a class="tab" href="Queue.dc.html">Очередь <span class="cnt" style="color:#5A49E0">10</span></a><a class="tab" href="Incident.dc.html">Аварии <span class="cnt" style="color:#D4380D">1</span></a><a class="tab" href="Log.dc.html">Журнал</a><a class="tab on" href="People.dc.html">Исполнители</a></nav><div style="display:flex;align-items:center;gap:10px;justify-content:flex-end"><button class="icb lg" aria-label="Уведомления"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4zM10 20a2 2 0 0 0 4 0"></path></svg></button><a class="ava" href="#profile" aria-label="Профиль" style="">ОС</a></div></header>
<main style="position:relative;z-index:1;max-width:1376px;margin:0 auto;padding:8px 32px 48px;display:flex;flex-direction:column;gap:20px">
<div style="display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap">
<div><h1 class="h1">Исполнители</h1><div class="sub">Кто на смене, чем занят и что умеет. ИИ учитывает это, когда предлагает исполнителя.</div></div>
<div class="lg" style="display:flex;gap:2px;padding:3px;border-radius:12px"><sc-for list="{{ tabs }}" as="t" hint-placeholder-count="5"><button class="seg" onClick="{{ t.pick }}" style="{{ t.style }}">{{ t.n }}</button></sc-for></div>
</div>
<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:start">
<sc-for list="{{ people }}" as="p" hint-placeholder-count="6">
<button class="glass" onClick="{{ p.pick }}" style="font:inherit;color:#0F1222;text-align:left;border:none;cursor:pointer;padding:20px;animation:rise .35s both;{{ p.card }}">
<span style="display:flex;align-items:center;gap:12px">
<span style="width:44px;height:44px;border-radius:50%;flex:none;background:#14172B;color:#fff;font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center">{{ p.ini }}</span>
<span style="flex:1;min-width:0"><b style="display:block;font-size:16px">{{ p.name }}</b><span class="k">{{ p.dep }}</span></span>
</span>
<span style="display:flex;align-items:center;gap:8px;margin-top:14px;font-size:13px;font-weight:600"><span style="width:8px;height:8px;border-radius:50%;background:{{ p.sc }}"></span>{{ p.status }}</span>
<span style="display:flex;justify-content:space-between;font-size:13px;margin:14px 0 6px"><span class="k">Загрузка</span><b style="color:{{ p.lc }}">{{ p.load }}</b></span>
<span class="bar"><span style="width:{{ p.lw }};background:{{ p.lc }}"></span></span>
<span style="display:flex;gap:6px;flex-wrap:wrap;margin-top:14px"><sc-for list="{{ p.skills }}" as="s" hint-placeholder-count="3"><span style="font-size:12px;font-weight:600;padding:5px 10px;border-radius:999px;box-shadow:inset 0 0 0 1px rgba(15,18,34,.12)">{{ s }}</span></sc-for></span>
<span class="k" style="display:block;margin-top:12px">{{ p.stats }}</span>
<sc-if value="{{ p.open }}" hint-placeholder-val="{{ false }}">
<span style="display:block;margin-top:14px;padding-top:12px;border-top:1px solid rgba(15,18,34,.07);animation:pop .3s both">
<span class="k" style="display:block;margin-bottom:6px">Сейчас в работе</span>
<sc-for list="{{ p.tasks }}" as="t" hint-placeholder-count="2"><span style="display:block;font-size:14px;padding:4px 0">{{ t }}</span></sc-for>
</span>
</sc-if>
</button>
</sc-for>
</div></main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {

  constructor(p) { super(p); this.state = { f: 'Все', open: 'Петров С. В.' }; }
  renderVals() {
    const P = [
      ['ПС', 'Петров С. В.', 'Рабочие места', 'на смене до 17:00', '#0E8A5F', 2, 6, ['Принтеры HP', 'ПК', 'Мониторы'], 'Решил за месяц 34 · в среднем 1 ч 40 мин', ['№ 0412 · Не печатает принтер HP', '№ 0416 · Мерцает монитор']],
      ['СА', 'Сидоров А.', 'ПО и почта', 'на смене до 20:00', '#0E8A5F', 5, 6, ['Установка ПО', 'Почта', 'Пароли'], 'Решил за месяц 51 · в среднем 50 мин', ['№ 0405 · Архиватор', '№ 0398 · Пароль почты']],
      ['ОИ', 'Орлов И.', 'Сеть', 'массовый сбой, корп. Б', '#B26A00', 4, 6, ['Коммутаторы', 'VPN', 'Wi-Fi'], 'Решил за месяц 28 · в среднем 2 ч 10 мин', ['Инцидент И-0031 · сеть 3 этажа']],
      ['ЛК', 'Лебедев К.', 'ПО и 1С', 'на смене до 20:00', '#0E8A5F', 1, 6, ['1С', 'Лицензии'], 'Решил за месяц 19 · в среднем 3 ч', ['№ 0409 · Ошибка лицензии 1С']],
      ['КД', 'Ковалёв Д.', 'Дежурные', 'в пути на аварию', '#D4380D', 1, 2, ['Аварии', 'Электрика', 'Серверная'], 'Аварий за месяц 3 · реакция 4 мин', ['№ 0415 · Дым из принтера']],
      ['МТ', 'Мухина Т.', 'Рабочие места', 'не на смене · с 20:00', '#C9CDE0', 0, 6, ['ПК', 'Телефония'], 'Решила за месяц 30 · в среднем 1 ч 55 мин', []]
    ];
    const T = ['Все', 'Рабочие места', 'Сеть', 'ПО и 1С', 'Дежурные'];
    const st = this.state;
    return {
      tabs: T.map((t) => ({ n: t, style: t === st.f ? 'background:#fff;color:#0F1222;box-shadow:0 2px 8px rgba(40,46,110,.1)' : '', pick: () => this.setState({ f: t }) })),
      people: P.filter((p) => st.f === 'Все' || p[2] === st.f || (st.f === 'ПО и 1С' && p[2].startsWith('ПО'))).map((p) => {
        const r = p[5] / p[6];
        const lc = r >= 0.8 ? '#B26A00' : '#14172B';
        return { ini: p[0], name: p[1], dep: p[2], status: p[3], sc: p[4], load: p[5] + ' из ' + p[6] + ' задач', lw: Math.round(r * 100) + '%', lc, skills: p[7], stats: p[8], tasks: p[9].length ? p[9] : ['Задач нет'], open: st.open === p[1], card: st.open === p[1] ? 'background:#fff;box-shadow:inset 0 0 0 1.5px #14172B,0 12px 40px rgba(40,46,110,.12)' : '', pick: () => this.setState({ open: st.open === p[1] ? '' : p[1] }) };
      })
    };
  }
}
</script>
</body>
</html>
