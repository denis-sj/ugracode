name: check

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Покрытие в SonarQube не подключено: нет @vitest/coverage-v8 (docs/hackathon/delivery.md).
      - run: pnpm check
      - run: pnpm test:coverage
      - name: Проверка ссылок документации
        run: python3 -m unittest discover -s tests
